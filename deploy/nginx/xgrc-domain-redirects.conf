# Extra XGRC domains: permanent redirects to the matching page on xgrcsoftware.com.
# Installed as /etc/nginx/sites-enabled/xgrc-domain-redirects (copy, like xgrcsoftware).
#
# How traffic arrives: each domain's DNS sits in Cloudflare, proxied (orange cloud), with
# SSL/TLS mode "Full". Cloudflare terminates HTTPS for the visitor and connects to this origin
# on 443, so the self-signed origin cert below is fine (same pattern as xgrcsoftware.com).
# Port 80 is not internet-reachable on this box, so there is no listen 80 block.
#
# To add a domain: add both "name" and "www.name" to the map, then nginx -t && reload.

map $host $xgrc_domain_redirect {
    default                    https://xgrcsoftware.com/;

    sheqx.com                  https://xgrcsoftware.com/sheqx/;
    www.sheqx.com              https://xgrcsoftware.com/sheqx/;
    sheqx.online               https://xgrcsoftware.com/sheqx/;
    www.sheqx.online           https://xgrcsoftware.com/sheqx/;
    sheq.cloud                 https://xgrcsoftware.com/sheqx/;
    www.sheq.cloud             https://xgrcsoftware.com/sheqx/;
    sheqx.co.uk                https://xgrcsoftware.com/sheqx/;
    www.sheqx.co.uk            https://xgrcsoftware.com/sheqx/;

    msxcyber.com               https://xgrcsoftware.com/msxcyber/;
    www.msxcyber.com           https://xgrcsoftware.com/msxcyber/;
    msxcyber.cloud             https://xgrcsoftware.com/msxcyber/;
    www.msxcyber.cloud         https://xgrcsoftware.com/msxcyber/;
}

server {
    listen 443 ssl;
    server_name
        sheqx.com www.sheqx.com
        sheqx.online www.sheqx.online
        sheq.cloud www.sheq.cloud
        sheqx.co.uk www.sheqx.co.uk
        msxcyber.com www.msxcyber.com
        msxcyber.cloud www.msxcyber.cloud
        grcuniverse.com www.grcuniverse.com
        grcbureau.co.za www.grcbureau.co.za
        welcometox.cloud www.welcometox.cloud
        ussdanywhere.com www.ussdanywhere.com
        ussdanywhere.co.za www.ussdanywhere.co.za;

    access_log /var/log/nginx/xgrc-domain-redirects-access.log;
    error_log  /var/log/nginx/xgrc-domain-redirects-error.log;

    ssl_certificate     /etc/nginx/ssl/xgrcsoftware.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/xgrcsoftware.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Fixed landing page per domain; the visitor's path is dropped on purpose (these domains
    # never had their own pages, so a deep path would only land on a 404).
    return 301 $xgrc_domain_redirect;
}
