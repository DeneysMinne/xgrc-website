# xgrcsoftware.com production vhost, installed as /etc/nginx/sites-enabled/xgrcsoftware
# Kept in the repo so changes go through review. Install steps: SEO-NOTES.md "Manual changes".

server {
    listen 80;
    server_name xgrcsoftware.com www.xgrcsoftware.com;

    access_log /var/log/nginx/xgrcsoftware-access.log;
    error_log  /var/log/nginx/xgrcsoftware-error.log;

    # Let's Encrypt HTTP-01 challenge — must be served over plain HTTP,
    # so it has to sit ahead of the blanket HTTPS redirect below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://xgrcsoftware.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.xgrcsoftware.com;

    access_log /var/log/nginx/xgrcsoftware-access.log;
    error_log  /var/log/nginx/xgrcsoftware-error.log;

    ssl_certificate     /etc/nginx/ssl/xgrcsoftware.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/xgrcsoftware.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://xgrcsoftware.com$request_uri;
}

server {
    listen 443 ssl;
    server_name xgrcsoftware.com;

    access_log /var/log/nginx/xgrcsoftware-access.log;
    error_log  /var/log/nginx/xgrcsoftware-error.log;

    ssl_certificate     /etc/nginx/ssl/xgrcsoftware.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/xgrcsoftware.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/www/XGRC_WEBSITE/dist;
    index index.html;

    location /api/demo {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # Demo dashboard gallery — actively edited, must never be cached (and a typo'd
    # path here should 404 rather than soft-200 to the homepage via the SPA fallback)
    location ^~ /preview/ {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # Every redirect on the site (single-hop 301s). Checked by scripts/check-redirects.mjs
    include /opt/www/XGRC_WEBSITE/deploy/nginx/redirects.conf;

    # .md twins for AI crawlers: served as text/markdown, with a Link header
    # naming the HTML page as canonical so Google indexes the page, not the .md
    # (SEO Fix Spec T5). /erm.md -> /erm/, /insights/x.md -> /insights/x/.
    # A .md with no matching HTML page gets X-Robots-Tag: noindex instead.
    location ~ ^(?<md_page>/.+)\.md$ {
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        if (!-f $document_root$md_page/index.html) {
            add_header X-Robots-Tag "noindex" always;
        }
        add_header Link "<https://xgrcsoftware.com$md_page/>; rel=\"canonical\"" always;
        try_files $uri =404;
    }

    # Unknown URLs return a real 404 with the 404 page (SEO Fix Spec T1).
    # Before 2026-09-29 this fell back to /index.html, a soft 404.
    # A folder with no index.html (for example /case-studies/) is a 404 too, not a 403.
    error_page 404 /404.html;
    error_page 403 =404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
