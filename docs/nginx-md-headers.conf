# Markdown-twin serving for LLMs / AI agents.
# Included inside both the staging (xgrcwebsite) and production (xgrcsoftware)
# server blocks, before the `location /` SPA fallback, so it takes precedence.
#
# Purpose: the .md twins generated into dist/ (see src/lib/markdown.js) have no
# entry in nginx mime.types, so nginx serves them as application/octet-stream,
# which browsers download instead of display. This serves them as text/markdown
# with a UTF-8 charset.
#
# Deliberately uses only default_type/charset (not add_header): the .md files
# live at their own URLs (e.g. /sheqx.md) rather than being content-negotiated
# on the HTML URL, so no Vary/Link headers are needed. Avoiding add_header also
# preserves any server-level add_header inheritance — notably the staging
# vhost's X-Robots-Tag "noindex", which must keep applying to .md on staging.
location ~ \.md$ {
    default_type text/markdown;
    charset utf-8;
    charset_types text/markdown;
    try_files $uri =404;
}
